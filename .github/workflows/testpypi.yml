name: Publish to TestPyPI

# Fires on every version tag push. Stage with a pre-release tag (e.g.
# `v2.1.0rc1` on a version-only commit), so the real version is never burned on
# TestPyPI before review.
#
# Flow (/pubpypi):
#   1. tag vX.Y.ZrcN + push                          → this workflow (TestPyPI)
#   2. verify install from TestPyPI, independent review
#   3. on GO: tag vX.Y.Z on main, then run pypi.yml (workflow_dispatch) from that tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Manual trigger

jobs:
  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
        # No token — uses OIDC trusted publisher configured at
        # https://test.pypi.org/manage/project/faf-python-sdk/settings/publishing/
