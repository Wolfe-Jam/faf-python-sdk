[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faf-python-sdk"
version = "1.3.1"
description = "Persistent project context for Python — parse, validate, and score `.faf` files. The foundation other Python FAF tools (gemini-faf-mcp, custom MCP servers, CI validators) build on. IANA-registered application/vnd.faf+yaml."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "wolfejam", email = "wolfejam@faf.one"}
]
keywords = [
    "faf",
    "ai-context",
    "yaml",
    "mcp",
    "claude",
    "grok",
    "project-context"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup"
]
requires-python = ">=3.8"
dependencies = [
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0"
]

[project.urls]
Homepage = "https://faf.one"
Documentation = "https://github.com/Wolfe-Jam/faf-python-sdk"
Repository = "https://github.com/Wolfe-Jam/faf-python-sdk"
Issues = "https://github.com/Wolfe-Jam/faf-python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["faf_sdk"]

# Ship the vendored Dart-detection KNOWLEDGE spec (loaded at runtime by detect.py).
# Synced byte-for-byte from faf-cli src/detect/dart-detection.json (the Truth).
[tool.hatch.build]
artifacts = ["faf_sdk/dart_detection.json"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

# PEP 561 — mark package as typed for mypy consumers (gemini-faf-mcp, etc.)
[tool.hatch.build.targets.wheel.force-include]
"faf_sdk/py.typed" = "faf_sdk/py.typed"
